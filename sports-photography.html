<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Photography — Sophia Cober</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
<style>
  .photo-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .photo-grid-item {
    cursor: pointer;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    aspect-ratio: 4 / 3;
  }
  .photo-grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }
  .photo-grid-item:hover img { transform: scale(1.06); }
</style>
</head>
<body>

<nav class="back-nav">
  <a href="../index.html#work">&larr; Back to Portfolio</a>
</nav>

<header class="project-header">
  <p class="project-cat">Photography</p>
  <h1 class="project-title">Sports Photography</h1>
  <!-- EDIT YOUR DESCRIPTION HERE -->
  <p class="project-desc is-placeholder" id="projectDesc">Add your description here — what the shoot was, your role, and any equipment or approach worth mentioning.</p>
</header>

<div class="photo-grid" id="photoGrid">
  <!-- Images load in from the list below -->
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-media-wrap" id="mediaWrap">
      <button class="overlay-close" id="closeBtn" aria-label="Close">&times;</button>
      <button class="overlay-prev" id="prevBtn" aria-label="Previous">&#8249;</button>
      <button class="overlay-next" id="nextBtn" aria-label="Next">&#8250;</button>
    </div>
    <p class="overlay-counter" id="counter"></p>
  </div>
</div>

<script>
  // Photo order: Wide Action, Lineout, Scrum Pass, Headgear, Fend/Tackle, Ruck, Ball in Air, Try, Ball-Spot
  const photos = [
    "../images/rugby-wide-action.jpg",
    "../images/rugby-lineout.jpg",
    "../images/rugby-scrum-pass.jpg",
    "../images/rugby-headgear.jpg",
    "../images/rugby-fend-tackle.jpg",
    "../images/rugby-ruck.jpg",
    "../images/rugby-ball-in-air.jpg",
    "../images/rugby-try.jpg",
    "../images/rugby-ball-spot.jpg"
  ];

  const grid = document.getElementById('photoGrid');
  photos.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'photo-grid-item';
    item.dataset.index = i;
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Sports photography ' + (i + 1);
    item.appendChild(img);
    item.addEventListener('click', () => openOverlay(i));
    grid.appendChild(item);
  });

  let current = 0;
  const overlay = document.getElementById('overlay');
  const mediaWrap = document.getElementById('mediaWrap');
  const counter = document.getElementById('counter');

  function render() {
    mediaWrap.querySelectorAll('img').forEach(el => el.remove());
    const img = document.createElement('img');
    img.src = photos[current];
    img.onload = () => { mediaWrap.style.aspectRatio = img.naturalWidth + '/' + img.naturalHeight; };
    mediaWrap.appendChild(img);
    counter.textContent = (current + 1) + ' / ' + photos.length;
  }

  function openOverlay(i) {
    current = i;
    render();
    overlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeOverlay() {
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  document.getElementById('closeBtn').addEventListener('click', closeOverlay);
  document.getElementById('nextBtn').addEventListener('click', (e) => { e.stopPropagation(); current = (current + 1) % photos.length; render(); });
  document.getElementById('prevBtn').addEventListener('click', (e) => { e.stopPropagation(); current = (current - 1 + photos.length) % photos.length; render(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', (e) => {
    if (!overlay.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeOverlay();
    if (e.key === 'ArrowRight') { current = (current + 1) % photos.length; render(); }
    if (e.key === 'ArrowLeft') { current = (current - 1 + photos.length) % photos.length; render(); }
  });
</script>

</body>
</html>
